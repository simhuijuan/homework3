name: Verify and Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & import check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push to the Hugging Face Space for user 'simhuijuan' and space 'homework3'
          git push --force https://simhuijuan:${HF_TOKEN}@huggingface.co/spaces/simhuijuan/homework3 HEAD:main
